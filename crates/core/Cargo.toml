# The product without a presenter: model, read-only T3 projection, synthetic demo,
# cell-grid composition and the headless parity/benchmark modes. No drawing dependency.
[package]
name = "t3-agents-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
libc.workspace = true
memchr = "2"
rusqlite.workspace = true

[features]
# The presenter's deterministic frame-stream check (`--frame-stream`) posts polls to a detached mailbox.
frame-stream = []

[dev-dependencies]
flate2 = "1"
